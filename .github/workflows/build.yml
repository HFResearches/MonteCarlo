name: MonteCarlo Build System

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt install cmake clang ccache -y
      - run: cmake -S . -B build
      - run: cmake --build build

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: MonteCarlo
          path: build/MonteCarlo
          retention-days: 30
