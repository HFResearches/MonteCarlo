name: MonteCarlo Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: cmake -S . -B build

      - run: cmake --build build

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MonteCarlo
          path: build/MonteCarlo
